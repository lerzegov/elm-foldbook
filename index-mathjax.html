<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>elm-foldbook</title>
    <script>
        window.MathJax = {
            loader: { load: ['input/asciimath', 'output/svg'] },
            asciimath: {
                displaystyle: true
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    MathJax.startup.promise = MathJax.startup.promise.then(() => {
                        const isFileSystemAccessSupported = 'showSaveFilePicker' in window;

                        async function saveFile(data) {
                            const { content, path } = data;
                            const blob = new Blob([content], { type: 'text/plain' });

                            if (isFileSystemAccessSupported) {
                                const options = {
                                    suggestedName: path.split('/').pop(),
                                    types: [{
                                        description: 'Text Files',
                                        accept: { 'text/plain': ['.txt', '.emu'] },
                                    }],
                                };

                                try {
                                    const handle = await window.showSaveFilePicker(options);
                                    const writable = await handle.createWritable();
                                    await writable.write(blob);
                                    await writable.close();
                                    console.log('File saved successfully.');
                                } catch (error) {
                                    console.error('Error saving file:', error);
                                }
                            } else {
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = path.split('/').pop();
                                a.click();
                                URL.revokeObjectURL(a.href);
                            }
                        }

                        var app = Elm.Main.init({
                            node: document.querySelector("main")
                        });

                        app.ports.renderMathJax.subscribe(function(input) {
                            renderMathJaxToSvg(input, function(svg) {
                                app.ports.receiveSvg.send([input, svg]);
                            });
                        });

                        app.ports.saveFile.subscribe(function(data) {
                            saveFile(data);
                        });

                        // Delayed initialization to ensure editors are in DOM
                        setTimeout(() => {
                            console.log('Delayed DOM check');
                            const formulaEditors = document.querySelectorAll('code-mirror-formula-editor');
                            console.log('Found formula editors after delay:', formulaEditors.length);

                            if (formulaEditors.length > 0) {
                                formulaEditors.forEach((curFormulaEditor) => {
                                    curFormulaEditor.setAppInstance(app);
                                    console.log('set app in ' + curFormulaEditor.id);

                                    curFormulaEditor.addEventListener('formulaContentChanged', function(event) {
                                        app.ports.formulaContentChanged.send(event.detail);
                                    });
                                });
                            } else {
                                console.log('No code-mirror-formula-editor elements found after delay');
                            }
                            const markupEditors = document.querySelectorAll('code-mirror-markup-editor');
                            console.log('Found markup editors after delay:', markupEditors.length);

                            if (markupEditors.length > 0) {
                                markupEditors.forEach((curMarkupEditor) => {
                                    curMarkupEditor.setAppInstance(app);
                                    console.log('set app in ' + curMarkupEditor.id);

                                    curMarkupEditor.addEventListener('formulaContentChanged', function(event) {
                                        app.ports.formulaContentChanged.send(event.detail);
                                    });
                                });
                            } else {
                                console.log('No code-mirror-markup-editor elements found after delay');
                            }
                        }, 100); // Adjust delay as necessary


                        app.ports.openNewTab.subscribe(function(url) {
                            window.open(url, '_blank');
                        });

                        function renderMathJaxToSvg(math, callback) {
                            const container = document.createElement('div');
                            container.style.display = 'none';
                            container.innerHTML = `\`${math}\``;
                            document.body.appendChild(container);

                            MathJax.typesetPromise([container]).then(() => {
                                const svg = container.querySelector('svg');
                                svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                                const svgString = new XMLSerializer().serializeToString(svg);
                                const encodedSvg = btoa(svgString);
                                callback(encodedSvg);
                                document.body.removeChild(container);
                            }).catch(function(err) {
                                console.error(err);
                            });
                        }
                    });
                }
            }
        };

    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/startup.js"></script>
</head>
<body>
    <main></main>
    <script src="./dist/ui.js"></script>
    <script src="./dist/codemirror-bundle.js"></script>
</body>
</html>
